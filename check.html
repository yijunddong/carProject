<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판정실</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/check.css">
    <script src="js/check.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-gradient-dark">
        <span class="navbar-brand mb-0 h1">
            <i class="fas fa-cog"></i> 판정실
        </span>
        <div class="ml-auto d-flex align-items-center">
            <div class="current-time mr-3">
                <i class="far fa-clock"></i> <span id="currengit push origin fet-time"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="row">
            <!-- 대기 차량 목록 -->
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-gradient-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-car"></i> 접수완료 차량
                        </h5>
                        <span class="badge badge-light badge-pill">
                            <i class="fas fa-users"></i> 총 3대
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="thead-light">
                                    <tr>
                                        <th>NO.</th>
                                        <th>차량번호</th>
                                        <th>차종</th>
                                        <th>작업</th>
                                    </tr>
                                </thead>
                                <tbody id="pendingList">
                                    <tr>
                                        <td>1</td>
                                        <td>123가4567</td>
                                        <td>현대 아반떼</td>
                                        <td>
                                            <button class="btn btn-sm btn-success" onclick="showModal(1, '현대 아반떼', '123가4567')">
                                                <i class="fas fa-check"></i> 검사 완료
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 완료 차량 목록 -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">검사완료 차량</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="thead-light">
                                    <tr>
                                        <th>NO.</th>
                                        <th>차량번호</th>
                                        <th>차종</th>
                                        <th>상태</th>
                                    </tr>
                                </thead>
                                <tbody id="completedList">
                                    <tr>
                                        <td>1</td>
                                        <td>456나7890</td>
                                        <td>기아 K5</td>
                                        <td>
                                            <span class="badge badge-success">완료</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 완료 처리 모달 -->
    <div class="modal fade" id="confirmationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-check-circle"></i> 검사 완료 확인
                    </h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="vehicleId">
                    <p>차량번호: <span id="vehiclePlateNo"></span></p>
                    <p>차종: <span id="vehicleModel"></span></p>
                    <p>검사를 완료하시겠습니까?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="speak($('#vehiclePlateNo').text())">
                        <i class="fas fa-volume-up"></i> 호출
                    </button>
                    <button type="button" class="btn btn-success" onclick="completeCheck()">완료</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
